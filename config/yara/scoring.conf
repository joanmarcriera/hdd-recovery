# YARA rule -> score map for image-yara-scan.sh.
#
# Format:  rule_name = score   (integer 0-100). Blank lines and lines starting
# with '#' are ignored. Add or tune rules here instead of editing the script.
# 'default' sets the score for any matched rule not listed below.
# Hits scoring >= 65 are cross-posted to wallet_candidates.
#
# If this file is missing or a value is unparseable, the script falls back to
# the built-in defaults (identical to the values below).

default = 50

ethereum_keystore             = 85
electrum_wallet_json          = 80
metamask_encrypted_vault      = 85
bitcoin_core_wallet_dat       = 75
exodus_wallet_passphrase_hint = 70
trust_wallet_keystore         = 65
bip32_extended_key            = 92
wif_private_key               = 88
armored_private_key           = 60
mnemonic_wordlist_file        = 55
