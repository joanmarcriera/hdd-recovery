name: Build and push image

# Builds the hdd-forensics container on a NATIVE amd64 runner (no QEMU
# emulation, which segfaults CPython during some Kali package post-install
# steps) and pushes it to Docker Hub.
#
# One-time setup: add two repository secrets under
#   Settings → Secrets and variables → Actions
#     DOCKERHUB_USERNAME = joanmarcriera
#     DOCKERHUB_TOKEN    = a Docker Hub access token (Account → Security)
#
# Then run it from the Actions tab → "Build and push image" → "Run workflow".

on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Optional extra image tag (e.g. v1.2.0)"
        required: false
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - 'bin/**'
      - 'lib/**'
      - 'sql/**'
      - 'config/**'
      - 'tui/**'

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest   # native linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: echo "version=$(git rev-parse --short HEAD)-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            joanmarcriera/hdd-forensics:latest
            joanmarcriera/hdd-forensics:${{ steps.ver.outputs.version }}
            ${{ inputs.extra_tag && format('joanmarcriera/hdd-forensics:{0}', inputs.extra_tag) || '' }}

      - name: Summary
        run: |
          echo "Pushed joanmarcriera/hdd-forensics:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed joanmarcriera/hdd-forensics:${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
